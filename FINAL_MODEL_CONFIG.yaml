# FINAL_MODEL_CONFIG.yaml
# Frozen per Sec. 11/13 BEFORE any test-split evaluation. Do not modify this
# file, or the architecture/hyperparameters it names, based on test-set
# results. If test results are disappointing, report them; do not return to
# candidate screening.
#
# Selection basis: MODEL_SELECTION_REPORT.md (validation-only, IEEE-123
# Stage 1/2/2b screening, seeds 21/22/23, cross-checked on IEEE-8500).

selected_model:
  candidate_id: c4b
  class: restoration.candidates.Candidate4bStudent
  display_name: "Planner-Distilled Sequentially-Masked Policy (PD-SMP)"
  one_line: >
    A compact per-agent MLP policy trained by behavior cloning from a
    closed-form beam-search restoration planner, fine-tuned with a
    single-critic advantage actor-critic objective, and executed with agents
    acting in a fixed sequential order under an incremental joint-radiality
    action mask (fault/open-closed per-agent constraints + a running
    cross-agent cycle check), so the joint action is feasible by construction
    rather than by a learned soft feasibility signal.

architecture:
  actor: independent per-agent MLP (2 hidden layers, SiLU), hidden_dim=32
  critic: single centralized MLP V(s_t) (2 hidden layers, SiLU), hidden_dim=32
  observation: >
    local_observation(agent, source_view=False) per agent = [local switch
    status, local fault mask, DER availability, load scale, episode
    progress]; global critic observation = full switch status + full fault
    mask + [DER availability, load scale, episode progress].
  action_selection: sequential by agent index 0..n_agents-1; mask =
    sequential_hard_mask(env, agent, partial_status, use_cycle_mask=True)
    (restoration/candidates.py)
  discriminator: none (removed relative to source method; W2/W7)
  entropy_temperature: none (removed relative to source method; W7)
  target_network: none for the actor; critic is trained directly against
    Monte Carlo/bootstrapped returns each update (no soft target network)

datasets_and_systems:
  - ieee123 (data/processed/ieee123_feeder.json)
  - ieee8500 (data/processed/ieee8500_feeder.json)
  split_manifest: DATA_SPLIT_MANIFEST.csv (train/validation/test by held-out
    fault identity, generated by scripts/prepare_feeders.py; frozen, see
    DATA_AUDIT.md)

preprocessing:
  scaling: none required (all observation components are already in [0,1] or
    bounded ranges by construction: switch status in {0,1}, fault mask in
    {0,1}, DER availability/load scale in [0,1] or documented scenario
    ranges, episode progress in [0,1])
  feature_fitting: none is fit from data (no learned scaler/PCA), so no
    train-only-fitting concern applies beyond scenario-split leakage control
    already enforced by DATA_SPLIT_MANIFEST.csv

training_procedure:
  stage_1_behavior_cloning:
    planner: restoration.candidates.greedy_plan (beam search, beam_width=4)
    pretrain_iterations: 500
    loss: per-agent masked cross-entropy against planner action
    optimizer: Adam, lr=3e-3 (shared with stage 2; single optimizer instance)
  stage_2_rl_fine_tuning:
    algorithm: on-policy advantage actor-critic (Monte-Carlo/bootstrapped
      return, GAMMA=0.95), scripts/train_candidate.py:actor_critic_update
    episodes: 400
    batch_episodes: 8 (i.e., 50 gradient updates)
    optimizer: Adam, lr=3e-3
    critic_loss_weight: 0.5
    gradient_clip_norm: 5.0
    entropy_bonus: none (relies on categorical sampling + reduced action
      space from hard masking for exploration; documented simplification)
  seeds_for_screening (not used for headline numbers): 21, 22, 23
  seeds_for_headline_test_evaluation: 101, 102, 103, 104, 105
    (disjoint from screening seeds; matches the seed set already used for
    SOURCE_METHOD_REPRODUCTION and the benchmark suite for fair comparison)
  horizon: 16 (env.horizon, matches source paper's episode step limit)

model_selection_metric: validation-split mean DER-utilization
  (der_utilization, restoration/environment.py:_evaluate), with a
  zero-violation requirement enforced as a gate, not a soft penalty:
  a candidate/checkpoint with any nonzero validation violation rate is
  disqualified before comparing restoration levels. This is the mechanism
  that eliminated plain Candidate 4 in favor of c4b (MODEL_SELECTION_REPORT.md).

early_stopping: none (fixed 400-episode budget; no checkpoint selection
  during stage 2 beyond the final policy after the fixed budget, since
  restoration was monotonically stable across the screened seeds - see
  MODEL_SELECTION_REPORT.md for the per-seed spread that justifies this)

class_balancing / augmentation: not applicable (RL task, not classification)

thresholds: none (categorical action selection via argmax at evaluation,
  sampling during training; no probability threshold is used)

reproduction_command: |
  $env:PYTHONPATH = (Resolve-Path '.\src').Path
  foreach ($seed in 101..105) {
    python .\scripts\train_candidate.py --system ieee123 --candidate c4b `
      --seed $seed --episodes 400 --pretrain-iterations 500 `
      --output FINAL_MODEL_data
    python .\scripts\train_candidate.py --system ieee8500 --candidate c4b `
      --seed $seed --episodes 400 --pretrain-iterations 500 `
      --output FINAL_MODEL_data
  }
